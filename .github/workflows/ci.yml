name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # >=20.19 évite les avertissements EBADENGINE (eslint-visitor-keys, etc.)
          node-version: "20.19"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint (Expo)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck
