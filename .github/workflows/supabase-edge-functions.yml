# Vérifie les Edge Functions (Deno) — aligné avec le runtime Supabase
name: Supabase Edge Functions

on:
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "supabase/functions/**"
  pull_request:
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    name: Deno check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.46.3

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}

      - name: Deno check (Edge Functions)
        shell: bash
        run: |
          set -euo pipefail
          if ! find supabase/functions -name 'index.ts' | grep -q .; then
            echo "Aucun supabase/functions/**/index.ts trouvé — rien à vérifier."
            exit 0
          fi
          find supabase/functions -name 'index.ts' -print -exec deno check {} \;
